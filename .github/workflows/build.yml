name: Build TubeVault APK

on:
  push:
  workflow_dispatch:

# a newer push replaces an older, still-running build
concurrency:
  group: tubevault-build
  cancel-in-progress: true

# needed to publish the GitHub Release that the in-app updater reads
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack project if a .zip was uploaded
        run: |
          shopt -s nullglob
          if [ ! -f settings.gradle.kts ]; then
            for z in *.zip; do
              echo "Unzipping $z"
              unzip -oq "$z" -d _project
            done
          fi
          ROOT=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n 1 | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            echo "settings.gradle.kts not found - upload the TubeVault project (or its zip) to the repo root"
            exit 1
          fi
          echo "Project root: $ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Fetch whisper.cpp (on-device speech-to-text for Karaoke mode)
        run: |
          cd "$PROJECT_DIR/app/src/main/cpp"
          rm -rf whisper.cpp
          git clone --depth 1 --branch v1.9.6 https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          rm -rf whisper.cpp/.git
          echo "TV_NDK_VERSION=$(basename "${ANDROID_NDK_LATEST_HOME:-}")" >> "$GITHUB_ENV"

      - name: Check whatsnew.json
        run: |
          jq -e '.title and (.highlights | type == "array")' "$PROJECT_DIR/app/src/main/assets/whatsnew.json" > /dev/null \
            || { echo "app/src/main/assets/whatsnew.json is not valid JSON (needs title + highlights)"; exit 1; }

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/TubeVault.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeVault-APK
          path: out/TubeVault.apk
          if-no-files-found: error

      # ---- publish a GitHub Release: installed apps find it and update themselves ----
      - name: Write update.json (what the app reads)
        run: |
          VN=$(grep -oP 'versionName = "\K[^"]+' "$PROJECT_DIR/app/build.gradle.kts" | head -n 1)
          VC=$((GITHUB_RUN_NUMBER + 100))
          TAG="v${VN}-b${GITHUB_RUN_NUMBER}"
          SIZE=$(stat -c%s out/TubeVault.apk)
          SHA=$(sha256sum out/TubeVault.apk | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/TubeVault.apk"
          WN="$PROJECT_DIR/app/src/main/assets/whatsnew.json"
          jq -n --argjson vc "$VC" --arg vn "$VN" --arg apk "$URL" --argjson size "$SIZE" --arg sha "$SHA" \
            --arg pub "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --slurpfile wn "$WN" \
            '{versionCode:$vc, versionName:$vn, apk:$apk, size:$size, sha256:$sha, published:$pub} + $wn[0]' \
            > out/update.json
          jq -r '"## " + .title + "\n\n" + (.subtitle // "") + "\n\n" + ([.highlights[] | "- **" + .title + "** - " + .desc] | join("\n"))' "$WN" > out/notes.md
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VN=$VN" >> "$GITHUB_ENV"
          cat out/update.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/TubeVault.apk out/update.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "TubeVault ${VN} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file out/notes.md \
            --latest
          # keep only the 5 newest app releases (never touch the "models" release)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[] | select(.tagName != "models")] | .[5:] | .[].tagName' \
            | xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      # ---- one-time copy of the AI voice model into YOUR repo, so the app never depends on someone else's link ----
      - name: Mirror AI voice model (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view models --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "AI model release already exists"
          else
            curl -fL --retry 3 -o vocal-model.onnx "https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/UVR-MDX-NET-Inst_HQ_3.onnx"
            echo "317554b07fe1ea5279a77f2b1520a41ea4b93432560c4ffd08792c30fddf9adc  vocal-model.onnx" | sha256sum -c -
            gh release create models vocal-model.onnx \
              --repo "$GITHUB_REPOSITORY" \
              --title "AI models (used by the app)" \
              --notes "UVR-MDX-NET-Inst_HQ_3 voice separation model from the Ultimate Vocal Remover project (MIT licence). Downloaded once by the app." \
              --prerelease --latest=false
          fi
